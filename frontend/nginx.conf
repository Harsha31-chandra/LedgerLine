# LedgerLine — Production Frontend Nginx Configuration Template
# Processed at container startup via /docker-entrypoint.d/20-envsubst-on-templates.sh
# Supports Render dynamic $PORT and configurable $BACKEND_PUBLIC_URL

server {
    listen ${PORT};
    server_name localhost;

    # DNS Resolver: auto-detected from /etc/resolv.conf (Docker 127.0.0.11 or cloud environment)
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static text and script assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend API endpoints to internal Docker backend service or Render HTTPS backend
    location ~ ^/(auth|me|accounts|transactions|admin|audit|health|docs|openapi.json|redoc) {
        set $upstream "${BACKEND_PUBLIC_URL}";
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # Upstream Host and proxy forwarding headers
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # TLS / SNI configuration for HTTPS backends (ignored for HTTP backends)
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # Cache static bundled assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
